# Impact-hammer tap test of the cantilever beam (vcactl tap, procedure step 2), with the
# cantilever_tap_beam or cantilever_tap_shaker channels. Free mode 1 of the bare beam (27 Hz,
# zeta about 0.5 %) decays to 1 % in 5.4 s; the exponential window shortens that to the record
# and adds damping that the analysis subtracts (zeta = zeta_m - 1 / (2 pi f tau_w), tau_w in
# meta.json).
type = "tap"
name = "Tap test, cantilever beam"
record_s = 4.0             # record per hit (df = 0.25 Hz)
pretrigger_s = 0.02
trigger_n = 10.0           # hammer force that starts a record
hits = 5                   # accepted hits averaged
max_hits = 30
double_hit_fraction = 0.1
force_window_s = 0.02      # rubber tip pulses are a few ms; aluminium < 0.5 ms
exp_window_end = 0.05      # tau_w = 1.3 s: about +0.5 % damping at 27 Hz, +0.07 % at 170 Hz
f_max_hz = 5000.0
