# Sine dwell with ring-down, at three base levels (damping versus amplitude). After each
# dwell the drive is cut at a zero crossing and the control signal is recorded for
# ringdown_s with zero drive (ringdown_<step>.csv). events.csv logs each cut with its stream
# time and approximate wall-clock time, to align an external response measurement (Q2).
type = "stepped_sine"
name = "Ring-down at 120 Hz, 3 levels"
frequencies_hz = [120.0]
levels_db = [-12.0, -6.0, 0.0]
settle_s = 2.0
dwell_s = 3.0
ringdown_s = 2.0

breakpoints = [{ f_hz = 120.0, accel_g = 0.5 }]

[tolerance]
alarm_db = 1.0
abort_db = 3.0
