# Test settings: control, safety and pretest settings (independent of shaker, DAQ and sensor).
# The control accelerometer comes from the sensor file chosen with --sensor
# (config/sensors/*.toml, default pcb356b18).

# DAQ settings come from the device profile chosen with --daq (config/daq/*.toml, default
# usb6211). DAQ settings can be overridden here, for example:
# [daq]
# device = "Dev2"

[control]
frame_size = "auto"            # samples per frame at the control rate (df = fs / frame_size):
                               # "auto" (the smallest power of two with df <= line_spacing_hz and
                               # df <= f_lo / 2) or a fixed even number >= 256
line_spacing_hz = 6.25         # largest df for "auto": keeps a frame at >= 160 ms at every rate,
                               # so the loop timing (frames per level, pretest) stays the same
dof = 120                      # statistical degrees of freedom of the displayed/checked PSD
control_dof = 32               # degrees of freedom of the PSD used for drive correction
frf_averages = 32              # averages for the FRF (H1) estimate
correction_gain = 0.1          # fraction of the dB error corrected per frame (> 0.2 risks overshoot)
max_step_db = 1.0              # max drive correction per line per frame
max_correction_db = 15.0       # max accumulated correction per line
coherence_min = 0.5            # below this, |H| is interpolated from neighbouring lines
h_dynamic_range_db = 60.0      # floor for |H|^2 relative to its maximum in band
start_level_db = -12.0         # first level, relative to the target level
level_step_db = 3.0
level_tolerance_db = 1.0       # rms error allowed before stepping to the next level
min_frames_per_level = 8
max_frames_per_level = 200     # abort if a level cannot be reached within this many frames
rampdown_s = 0.5
snapshot_interval_s = 5.0      # PSD snapshot logging interval

[sine]                         # sine sweep / stepped sine profiles
correction_gain = 0.15         # fraction of the amplitude error (dB) corrected per half-frame;
                               # > 0.25 overshoots (loop delay of about 4 half-frames)
max_step_db = 1.0              # max drive correction per half-frame
max_correction_db = 20.0       # max accumulated correction relative to the pretest FRF
ramp_s = 2.0                   # ramp from control.start_level_db at the start and after a ring-down
settled_blocks = 3             # stepped sine: half-frames within alarm_db before the dwell starts

[safety]
max_clip_fraction = 0.005      # abort if more than this fraction of a block is clipped
payload_kg = 0.02              # fixture + specimen mass on the armature; the sensor's mass_kg
                               # (sensor file) is added to it
displacement_sigma = 3.0       # peak = sigma * rms for displacement/velocity pre-checks
accel_crest_factor = 4.5       # random: expected acceleration peak = crest * rms, checked against
                               # the sensor range
open_loop_db = 12.0            # abort if response is this far below the reference for 3 blocks
ai_overload_fraction = 0.98    # abort if |AI| reaches this fraction of the AI range
ai_range_margin_db = 3.0       # auto AI range: headroom above the expected peak (random: crest x rms)
abort_rampdown_s = 0.05

[pretest]
drive_rms_v = 0.01             # flat noise drive level for FRF estimation (V rms); 0.01 keeps
                               # the pretest within +/-5 g of the PCB 356B18 on every shaker
frames = 40
noise_blocks = 6               # blocks with zero drive for noise-floor measurement
min_snr_db = 10.0              # response must exceed the noise floor by this much
