# NI USB-4431 dynamic signal acquisition device (24-bit delta-sigma AI and AO, 4 AI, 1 AO).
# Values from Controller + DAQ + accellerometers/NI/NI-USB-443x-specifications.pdf
# in the Nextcloud project folder.
# Select with --daq usb4431.
#
# The accelerometer can be connected directly: IEPE excitation (2.1 mA) on AI0..AI3.
# With a charge amplifier, leave IEPE off. AI and AO are BNC, AI is pseudodifferential.
# The AO range is only +/-3.5 V peak, so the shaker's max_drive_v must be <= 3.5.
# Like the USB-6211, the AO glitches at power-up, and also when the AI sample rate or the AO base
# rate changes (hence one rate, see fs_io_auto_hz): switch the amplifier on only after the device
# has enumerated, and off before unplugging.
model = "NI USB-4431"
device = "Dev1"                # NI device name as shown by `vcactl list-devices` / NI MAX
ao_channel = "ao0"             # -> amplifier input (BNC AO 0)
ai_channel = "ai0"             # <- charge amplifier output or IEPE accelerometer (BNC AI 0)
ai_terminal_config = "PSEUDO_DIFF"
ai_range_v = "auto"            # fixed +/-10 V ("auto" always gives 10)
ai_coupling = "AC"             # AC (-3 dB at 0.8 Hz) or DC; AC is required with IEPE
iepe_current_ma = 2.1          # 0 (off) or 2.1
ao_range_v = 3.5               # fixed +/-3.5 V
fs_io_hz = "auto"              # AI/AO rate: "auto" (the lowest of fs_io_auto_hz whose band covers
                               # the profile) or a fixed AO update rate (see fs_allowed_hz)
# One rate only: changing the AI rate or the AO base rate makes the AO jump (datasheet "AO
# Transients"), which kicked the shaker at the start of a pretest (2026-10-23). At 51.2 kS/s
# the band goes to 23.2 kHz, beyond the PCB sensors, and the loopback runs at the same rate.
fs_io_auto_hz = [51200.0]
decimation = "auto"            # control rate = fs_io_hz / decimation; "auto" gives 1 (the
                               # converters filter, so no FIR rate change is needed)
ao_queue_blocks = 2            # half-frames queued ahead in the AO buffer (latency vs. underrun margin)

[limits]
ai_ranges_v = [10.0]
ao_ranges_v = [3.5]
ai_terminal_configs = ["PSEUDO_DIFF"]
ao_terminal_configs = []
ai_couplings = ["AC", "DC"]
iepe_currents_ma = [2.1]
fs_min_hz = 1000.0             # AI 1 kS/s .. 102.4 kS/s
fs_max_hz = 96000.0            # AO max update rate
# AO update rates fM / n, fM = 51.2k, 80k, 96k, n = 1, 2, 4 .. 64 (only those >= the 1 kS/s AI minimum).
fs_allowed_hz = [51200.0, 25600.0, 12800.0, 6400.0, 3200.0, 1600.0,
                 80000.0, 40000.0, 20000.0, 10000.0, 5000.0, 2500.0, 1250.0,
                 96000.0, 48000.0, 24000.0, 12000.0, 6000.0, 3000.0, 1500.0]
timebase_hz = 0.0
antialias_filter = true        # delta-sigma ADC, alias-free to 0.49 fs
ao_reconstruction_filter = true  # delta-sigma DAC with interpolation filter
driver = "nidaqmx"
ao_sync = "start_trigger"      # AO starts on ai/StartTrigger, both clocked from the same timebase
ao_on_demand = false           # DSA AO is hardware-timed only
iepe_compliance_v = 20.0       # IEPE compliance voltage, 20 V min
# AO -> AI delay per rate, measured with vcactl loopback on serial 1DFD63D (NI-DAQmx 26.5.0,
# 2026-10-23): the ADC filter delay of 39 samples (datasheet; the driver does not remove it) +
# the DAC filter delay, which depends only on the divider n of the AO rate fM / n (datasheet:
# "63.3 samples max", reached at n >= 32). filter_delay_by_rate[i] samples for fs_io_hz <=
# filter_delay_max_rate_hz[i] (n = 64, 32, 16, 8, 4, 2), filter_delay_samples above (n = 1).
filter_delay_max_rate_hz = [1500.0, 3000.0, 6000.0, 12000.0, 24000.0, 48000.0]
filter_delay_by_rate = [103.25, 102.8, 101.3, 98.85, 93.6, 83.05]
filter_delay_samples = 62.1
passband_fraction = 0.453      # AO flat to 0.453 fs (+/-0.4 dB), AI to 46.4 kHz at 102.4 kS/s
# Highest test frequency (0.453 * fs_io_hz without decimation): 23.2 kHz at 51.2 kS/s
# (43.5 kHz at 96 kS/s).
