# NI PXIe-4468 dynamic signal acquisition module (24-bit delta-sigma, 2 AI, 2 AO).
# Values from Controller + DAQ + accellerometers/NI/pxie-4468_specifications_2026-09-30-15-05-09.pdf
# in the Nextcloud project folder.
# Select with --daq pxie4468.
#
# The accelerometer can be connected directly: IEPE excitation 4, 10 or 20 mA (pseudodifferential
# input only). With a charge amplifier, leave IEPE off.
model = "NI PXIe-4468"
device = "PXI1Slot2"           # NI device name as shown by `vcactl list-devices` / NI MAX
ao_channel = "ao0"             # -> amplifier input (AO 0)
ai_channel = "ai0"             # <- charge amplifier output or IEPE accelerometer (AI 0)
ai_terminal_config = "PSEUDO_DIFF"  # DIFF or PSEUDO_DIFF (50 ohm from AI- to chassis)
ai_range_v = "auto"            # "auto" or 0.316, 1, 3.16, 10, 31.6, 42.4 (gain 30 .. -20 dB)
ai_coupling = "AC"             # AC (-3 dB at 0.8 Hz) or DC; AC is required with IEPE
iepe_current_ma = 0.0          # 0 (off), 4, 10 or 20
ao_range_v = 10.0              # ranges: 10, 3.16, 1, 0.316 (attenuation 0 .. 30 dB)
ao_terminal_config = "PSEUDO_DIFF"  # AO- tied to chassis via 50 ohm: suits a single-ended amplifier input
fs_io_hz = "auto"              # AI/AO rate: "auto" (the lowest of fs_io_auto_hz whose band
                               # covers the profile) or a fixed rate, 100 S/s .. 200 kS/s
fs_io_auto_hz = [1600.0, 3200.0, 6400.0, 12800.0, 25600.0, 51200.0, 102400.0, 200000.0]
decimation = "auto"            # control rate = fs_io_hz / decimation; "auto" gives 1 (the
                               # converters filter, so no FIR rate change is needed)
ao_queue_blocks = 2            # half-frames queued ahead in the AO buffer (latency vs. underrun margin)

[limits]
ai_ranges_v = [0.316, 1.0, 3.16, 10.0, 31.6, 42.4]
ao_ranges_v = [0.316, 1.0, 3.16, 10.0]
ai_terminal_configs = ["DIFF", "PSEUDO_DIFF"]
ao_terminal_configs = ["DIFF", "PSEUDO_DIFF"]
ai_couplings = ["AC", "DC"]
iepe_currents_ma = [4.0, 10.0, 20.0]
fs_min_hz = 100.0
fs_max_hz = 200000.0           # AO max (AI up to 250 kS/s)
fs_allowed_hz = []
timebase_hz = 0.0
antialias_filter = true        # delta-sigma ADC, alias-free to 0.454 fs
ao_reconstruction_filter = true  # delta-sigma DAC, image rejection 100 dB
driver = "nidaqmx"
ao_sync = "start_trigger"      # AO starts on ai/StartTrigger, both clocked from the same reference
ao_on_demand = false           # DSA AO is hardware-timed only
iepe_compliance_v = 24.0       # IEPE voltage compliance (bias + full scale must stay within 0-24 V)
# AO output delay per rate (datasheet table; the AI digital filter delay is compensated to 0 by
# the driver): filter_delay_by_rate[i] samples for fs_io_hz <= filter_delay_max_rate_hz[i], and
# filter_delay_samples above the last rate (190-200 kS/s).
filter_delay_max_rate_hz = [10000.0, 20000.0, 30000.0, 40000.0, 50000.0, 60000.0, 70000.0,
                            80000.0, 90000.0, 100000.0, 110000.0, 120000.0, 130000.0, 140000.0,
                            150000.0, 160000.0, 170000.0, 180000.0, 190000.0]
filter_delay_by_rate = [65.0, 67.0, 69.0, 71.0, 73.0, 75.0, 77.0, 80.0, 82.0, 84.0, 85.0, 87.0,
                        90.0, 92.0, 94.0, 97.0, 99.0, 101.0, 103.0]
filter_delay_samples = 106.0
passband_fraction = 0.454      # AI alias-free and AO passband: DC to 0.454 fs
# Highest test frequency (0.454 * fs_io_hz without decimation): 90.8 kHz at 200 kS/s.
