# Test-station configuration for the BK 4809 exciter driven by the BK 2718 amplifier.
# Same as station.toml except [daq] ao_channel comment and the [safety] drive limits, which are
# scaled to the 2718 at 20 dB gain (~5 A/V, full 5 A rms rating at 1 V rms input).
# Use with: vcactl run --station config/station_bk2718.toml --shaker bk4809 ...
# Also set the 2718 current limit knob to 5 A or lower and the gain switch to 20 dB.

[daq]
device = "Dev1"                # NI device name as shown by `vcactl list-devices` / NI MAX
ao_channel = "ao0"             # -> BK 2718 amplifier input
ai_channel = "ai1"             # <- charge amplifier output
ai_terminal_config = "DIFF"    # DIFF (AI1+/AI9-), RSE or NRSE
ai_range_v = 10.0              # USB-6211 ranges: 0.2, 1, 5, 10
fs_io_hz = 100000.0            # AI/AO rate; 20 MHz / fs_io_hz must be an integer
decimation = 4                 # control rate = fs_io_hz / decimation (25 kHz)
ao_queue_blocks = 2            # half-frames queued ahead in the AO buffer (latency vs. underrun margin)

[sensor]
sensitivity_mv_per_g = 10.0    # charge amplifier output scaling (mV/g)

[control]
frame_size = 4096              # samples per frame at the control rate (df = fs / frame_size)
dof = 120                      # statistical degrees of freedom of the displayed/checked PSD
control_dof = 32               # degrees of freedom of the PSD used for drive correction
frf_averages = 32              # averages for the FRF (H1) estimate
correction_gain = 0.1          # fraction of the dB error corrected per frame (> 0.2 risks overshoot)
max_step_db = 1.0              # max drive correction per line per frame
max_correction_db = 15.0       # max accumulated correction per line
coherence_min = 0.5            # below this, |H| is interpolated from neighbouring lines
h_dynamic_range_db = 60.0      # floor for |H|^2 relative to its maximum in band
start_level_db = -12.0         # first level, relative to the target level
level_step_db = 3.0
level_tolerance_db = 1.0       # rms error allowed before stepping to the next level
min_frames_per_level = 8
max_frames_per_level = 200     # abort if a level cannot be reached within this many frames
rampdown_s = 0.5
snapshot_interval_s = 5.0      # PSD snapshot logging interval

[safety]
max_drive_v = 2.5              # hard clip of AO0 (peak). 2718 (20 dB) reaches 5 A rms at 1 V rms.
max_drive_rms_v = 0.8          # abort if the drive rms exceeds this (80 % of the 1 V rms rating)
max_clip_fraction = 0.005      # abort if more than this fraction of a block is clipped
payload_kg = 0.02              # accelerometer + fixture + specimen mass on the armature
displacement_sigma = 3.0       # peak = sigma * rms for displacement/velocity pre-checks
open_loop_db = 12.0            # abort if response is this far below the reference for 3 blocks
ai_overload_fraction = 0.98    # abort if |AI| reaches this fraction of ai_range_v
abort_rampdown_s = 0.05

[pretest]
drive_rms_v = 0.05             # flat noise drive level for FRF estimation
frames = 40
noise_blocks = 6               # blocks with zero drive for noise-floor measurement
min_snr_db = 10.0              # response must exceed the noise floor by this much
