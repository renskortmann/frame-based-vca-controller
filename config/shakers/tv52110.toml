# TIRA Vibration Test System TV 52110 (exciter S 52110 + power amplifier BDA 120).
# Values from docs/data_sheet_system_tv_52110_eng_V11.pdf.
name = "TIRA TV 52110"
f_min_hz = 2.0
f_max_hz = 7000.0
force_sine_peak_n = 100.0
force_random_rms_n = 50.0          # random force according to ISO 5344:2004
accel_sine_peak_g = 50.0
accel_random_rms_g = 25.0
displacement_pp_mm = 15.0          # payload reduces the usable displacement
velocity_peak_m_s = 1.5
moving_mass_kg = 0.25
suspension_stiffness_n_per_mm = 13.1
armature_resonance_hz = 5700.0     # "main resonance frequency > 5700 Hz"
amp_input_full_v = 2.47            # BDA 120: 3.5 V peak (1 kHz sine) input for full power = 2.47 V rms
max_drive_v = 3.5                  # hard clip of the drive (peak) = full-power sine peak input
max_drive_rms_v = 1.5              # abort if the drive rms exceeds this

# Static payload limit (vertical mounting): the weight of accelerometer + fixture + specimen sags the
# suspension by payload * g / stiffness (0.75 mm/kg). At payload_static_max_kg the sag uses up the
# whole half-stroke (13.1 N/mm * 7.5 mm), so no displacement is left: the usable limit is lower.
# Not in the datasheet (it only says payload reduces the usable displacement); derived.
payload_static_max_kg = 10.0

# Dynamic payload limit (accelerometer + fixture + specimen) for flat random profiles
# from 20 Hz to f_max:
#
# Shaker (max stroke)      f_max            0.30 mm            0.96 mm            2.15 mm
# TIRA TV 52110 (15 mm)   200 Hz  9.82 kg†  (0.4 g)  3.55 kg   (1.3 g)  1.45 kg   (3.0 g)
#                         500 Hz  7.11 kg   (0.7 g)  2.08 kg   (2.2 g)  0.79 kg   (4.9 g)
#                          1 kHz  4.90 kg   (1.0 g)  1.38 kg   (3.1 g)  0.48 kg   (7.0 g)
#                          2 kHz  3.37 kg   (1.4 g)  0.90 kg   (4.4 g)  0.26 kg   (9.9 g)
#                          5 kHz  2.03 kg   (2.2 g)  0.47 kg   (7.1 g)  0.07 kg  (15.8 g)
#                          7 kHz  1.68 kg   (2.6 g)  0.36 kg   (8.4 g)  0.02 kg  (18.7 g)
#
# Unmarked values are limited by force: payload <= force_random_rms_n / (a_rms * g) - moving_mass_kg.
# † Limited by stroke when mounted vertically: the static sag plus half the vibration stroke
#   must fit in the half-stroke. Mounted horizontally, these values rise to the force limit.
# The stroke columns are the 3 sigma peak-peak displacement of flat PSDs of 0.001, 0.01 and
# 0.05 g2/Hz; they barely depend on f_max, but grow steeply for a lower start frequency.
# Values in brackets: the rms acceleration of the profile.
# The pre-flight check applies the force limit to the actual profile and safety.payload_kg.

# Model parameters used only by the simulated backend (--sim).
[sim]
amp_gain_a_per_v = 2.23            # mid-band equivalent of the voltage-mode BDA 120 (see tv51110.toml)
bl_n_per_a = 12.9
suspension_zeta = 0.15
armature_q = 8.0
