# Brüel & Kjær Vibration Exciter Type 4809 driven by a DAP-Audio Palladium P-2000 power amplifier.
# Values from Shakers/BK shaker 4809.pdf (BP 0231) and Shakers/DAP-AUDIO Palladium 2000.pdf
# (Palladium Vintage series product manual) in the Nextcloud project folder.
#
# Amplifier setup (adjust amp_input_full_v, max_drive_v, max_drive_rms_v and [sim] together if
# you change it):
#   stereo mode (never bridged), shaker on one channel, input attenuator of that channel turned
#   down to 9 V/V (about -20 dB from the standard 91x gain with the attenuator fully clockwise),
#   measured with a function generator and a true-RMS multimeter. Into the ~2 ohm exciter coil
#   this gives ~4.5 A/V, so 5 A rms (full rating) needs 1.11 V rms in.
#   The knob is not calibrated: after turning it, measure the gain G again, set
#   amp_input_full_v = 10 / G (5 A rms * 2 ohm), scale both drive limits by the same factor and
#   set [sim] amp_gain_a_per_v = G / 2.
# The P-2000 is a voltage-mode audio amplifier without a current limit (it can deliver over 1 kW);
# the drive limits below are the only protection of the 5 A rms coil rating. It is rated into
# 8 and 4 ohm only; the 2 ohm coil needs at most 10 V rms, far below the amplifier's power rating.
name = "BK 4809 + Palladium P-2000"
f_min_hz = 20.0                    # amplifier: 20 Hz - 20 kHz (-3 dB), subsonic protection at 10 Hz
f_max_hz = 20000.0
force_sine_peak_n = 44.5           # without forced air cooling (60 N with)
# The data sheets give no random rating: derived as sine peak / sqrt(2) (equal rms current).
force_random_rms_n = 31.5
accel_sine_peak_g = 75.0           # bare table, no air cooling (736 m/s^2)
accel_random_rms_g = 53.0          # derived: 31.5 N / 0.060 kg
displacement_pp_mm = 8.0           # continuous; over-travel stops beyond that
velocity_peak_m_s = 1.65
moving_mass_kg = 0.060             # "dynamic weight of moving element"
suspension_stiffness_n_per_mm = 12.0
armature_resonance_hz = 20000.0    # "axial resonant frequency, bare table"
amp_input_full_v = 1.11            # P-2000 at 9 V/V (measured): 5 A rms into ~2 ohm = 10 V rms out
max_drive_v = 2.7                  # hard clip of the drive (peak), about 3 sigma of the rms limit
max_drive_rms_v = 0.89             # abort if the drive rms exceeds this (80 % of the 1.11 V rms rating)

# Static payload limit (vertical mounting): the weight of accelerometer + fixture + specimen sags the
# flexures by payload * g / stiffness (0.82 mm/kg). At payload_static_max_kg the sag uses up the
# whole half-stroke (12 N/mm * 4 mm), so no displacement is left: the usable limit is lower.
# Derived; the datasheet's performance curves go up to an 850 g payload (5 g sine).
payload_static_max_kg = 4.9

# Dynamic payload limit (accelerometer + fixture + specimen) for flat random profiles
# from 20 Hz to f_max:
#
# Shaker (max stroke)      f_max            0.30 mm            0.96 mm            2.15 mm
# BK 4809 (8 mm)          200 Hz  4.71 kg†  (0.4 g)  2.33 kg   (1.3 g)  1.01 kg   (3.0 g)
#                         500 Hz  4.58 kg   (0.7 g)  1.41 kg   (2.2 g)  0.60 kg   (4.9 g)
#                          1 kHz  3.18 kg   (1.0 g)  0.97 kg   (3.1 g)  0.40 kg   (7.0 g)
#                          2 kHz  2.22 kg   (1.4 g)  0.66 kg   (4.4 g)  0.26 kg   (9.9 g)
#                          5 kHz  1.38 kg   (2.2 g)  0.40 kg   (7.1 g)  0.14 kg  (15.8 g)
#                          7 kHz  1.16 kg   (2.6 g)  0.32 kg   (8.4 g)  0.11 kg  (18.7 g)
#                         10 kHz  0.96 kg   (3.2 g)  0.26 kg  (10.0 g)  0.08 kg  (22.3 g)
#
# Unmarked values are limited by force: payload <= force_random_rms_n / (a_rms * g) - moving_mass_kg.
# † Limited by stroke when mounted vertically: the static sag plus half the vibration stroke
#   must fit in the half-stroke. Mounted horizontally, these values rise to the force limit.
# The stroke columns are the 3 sigma peak-peak displacement of flat PSDs of 0.001, 0.01 and
# 0.05 g2/Hz; they barely depend on f_max, but grow steeply for a lower start frequency.
# Values in brackets: the rms acceleration of the profile.
# The pre-flight check applies the force limit to the actual profile and safety.payload_kg.

# Model parameters used only by the simulated backend (--sim).
[sim]
amp_gain_a_per_v = 4.5             # mid-band equivalent: 9 V/V gain / ~2 ohm coil impedance
                                   # (voltage mode; back-EMF damping is not modelled)
bl_n_per_a = 6.4                   # current-to-force ratio, 6.4 N/A
suspension_zeta = 0.15
armature_q = 8.0
