# TIRA Vibration Test System TV 51110 (exciter S 51110 + power amplifier BDA 120).
# Values from docs/data_sheet_system_tv_51110_eng_V10.pdf.
name = "TIRA TV 51110"
f_min_hz = 2.0
f_max_hz = 7000.0
force_sine_peak_n = 100.0
force_random_rms_n = 70.0          # random force according to ISO 5344:2004
accel_sine_peak_g = 45.0
accel_random_rms_g = 30.0
displacement_pp_mm = 13.0          # payload reduces the usable displacement
velocity_peak_m_s = 1.5
moving_mass_kg = 0.23
suspension_stiffness_n_per_mm = 8.0
armature_resonance_hz = 6500.0     # "main resonance frequency > 6500 Hz"
amp_input_full_v = 3.5             # BDA 120: input voltage (rms, 1 kHz sine) for full power

# Model parameters used only by the simulated backend (--sim).
[sim]
amp_gain_a_per_v = 1.57            # BDA 120 current mode: 5.5 A at 3.5 V input
bl_n_per_a = 12.9                  # ~100 N peak at 5.5 A rms
suspension_zeta = 0.15
armature_q = 8.0
